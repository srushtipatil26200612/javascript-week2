<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Day 4</title>
</head>

<body>

    <h1>Modern JavaScript</h1>

    <script>


        const products = [

            {
                name: "Laptop",
                price: 50000,
                category: "Electronics"
            },
            {
                name: "Mobile",
                price: 25000,
                category: "Electronics"
            },
            {
                name: "Shoes",
                price: 2000,
                category: "Fashion"
            },
            {
                name: "Headphones",
                price: 3000,
                category: "Electronics"
            },
            {
                name: "Mouse",
                price: 800,
                category: "Electronics"
            }
        ];


        // forEach()
        products.forEach(product => {
            console.log("Product:", product.name);
        });


        // map()
        const productNames = products.map(product => product.name);

        console.log("Product Names:", productNames);


        // filter()
        const cheapProducts = products.filter(product => product.price < 1000);

        console.log("Cheap Products:", cheapProducts);


        // filter() + map()
        const cheapProductNames = products
            .filter(product => product.price < 1000)
            .map(product => product.name);

        console.log("Cheap Product Names:", cheapProductNames);


        // reduce()
        const total = products.reduce((sum, product) => {
            return sum + product.price;
        }, 0);

        console.log("Total Price:", total);


        // find()
        const laptop = products.find(product => product.name === "Laptop");

        console.log("Laptop:", laptop);


        // Optional Chaining
        console.log("Laptop Category:", laptop?.category);


        // Template Literal
        console.log(`There are ${products.length} products.`);

    </script>

</body>

</html>
