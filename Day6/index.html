<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 6 - APIs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #products {
            margin-top: 20px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Product Search</h1>

    <button onclick="loadProducts()">Load Products</button>

    <p id="message"></p>

    <div id="products"></div>


    <script>

        async function loadProducts() {

            const productsContainer =
                document.getElementById("products");

            const message =
                document.getElementById("message");

            try {

                message.textContent = "Loading...";
                productsContainer.innerHTML = "";

                const response =
                    await fetch("https://fakestoreapi.com/products");

                const data =
                    await response.json();

                message.textContent = "";

                const products =
                    data.slice(0, 5);

                productsContainer.innerHTML =
                    products.map(product => `
                        
                        <div class="product">

                            <h2>${product.title}</h2>

                            <p>
                                <strong>Price:</strong>
                                ₹${product.price}
                            </p>

                            <p>
                                <strong>Category:</strong>
                                ${product.category}
                            </p>

                        </div>

                    `).join("");

            } catch (error) {

                message.textContent =
                    "Error: Unable to load products.";

                console.error(error);
            }
        }

    </script>

</body>
</html>
