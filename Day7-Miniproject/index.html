<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Search Application</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            font-size: 18px;
            margin: 20px;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product h3 {
            font-size: 18px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .category {
            color: #666;
        }

        @media (max-width: 600px) {

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Product Search Application</h1>
        <p>Search products using a public API</p>
    </header>


    <div class="container">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Enter product name..."
            >

            <button onclick="searchProducts()">
                Search
            </button>

        </div>


        <p id="message"></p>

        <div id="products"></div>

    </div>


    <script>

        async function searchProducts() {

            const searchInput =
                document.getElementById("searchInput");

            const productsContainer =
                document.getElementById("products");

            const message =
                document.getElementById("message");


            const searchText =
                searchInput.value.trim().toLowerCase();


            if (searchText === "") {

                message.textContent =
                    "Please enter a product name.";

                productsContainer.innerHTML = "";

                return;
            }


            try {

                message.textContent = "Loading...";

                productsContainer.innerHTML = "";


                
                const response =
                    await fetch("https://fakestoreapi.com/products");


                // Check API response
                if (!response.ok) {
                    throw new Error("API request failed");
                }


                const data =
                    await response.json();


                // Filter products
                const results =
                    data.filter(product =>
                        product.title
                            .toLowerCase()
                            .includes(searchText)
                    );


               
                if (results.length === 0) {

                    message.textContent =
                        "No products found.";

                    return;
                }


                message.textContent =
                    results.length + " product(s) found";


                productsContainer.innerHTML =
                    results.map(product => `

                        <div class="product">

                            <img
                                src="${product.image}"
                                alt="${product.title}"
                            >

                            <h3>
                                ${product.title}
                            </h3>

                            <p class="price">
                                ₹${product.price}
                            </p>

                            <p class="category">
                                Category: ${product.category}
                            </p>

                        </div>

                    `).join("");


            } catch (error) {

                message.textContent =
                    "Something went wrong. Please try again.";

                console.error(error);
            }
        }

    </script>

</body>
</html>
